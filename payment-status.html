<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status - Mermaid Beach Resort</title>
  <link rel="icon" type="image/ico" href="/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages/payment-status.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="status-card">
    <div id="statusIconBox" class="status-icon-box success">
      <i id="statusIcon" data-lucide="check" class="w-8 h-8"></i>
    </div>
    
    <h3 id="statusTitle" class="status-title">Booking Confirmed!</h3>
    <p id="statusDesc" class="status-desc">Your 30% advance payment has been verified via bKash.</p>
    
    <div id="receiptBox" class="receipt-details">
      <div class="receipt-row">
        <span class="receipt-label">Booking ID:</span>
        <span id="receiptBookingId" class="receipt-value font-mono">#0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Total Amount:</span>
        <span id="receiptTotal" class="receipt-value font-mono">৳0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Advance Paid (30%):</span>
        <span id="receiptAdvance" class="receipt-value price font-mono">৳0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Transaction ID:</span>
        <span id="receiptTrxId" class="receipt-value font-mono text-gray-400">N/A</span>
      </div>
    </div>
    
    <div class="btn-group">
      <button id="primaryActionBtn" class="btn btn-whatsapp btn-w-full">
        <i data-lucide="message-circle"></i> Contact Front Desk
      </button>
      <a href="/" id="secondaryActionBtn" class="btn btn-secondary btn-w-full">
        Back to Homepage
      </a>
    </div>
  </div>

  <script src="js/pages/payment-status.js"></script>
</body>
</html>
