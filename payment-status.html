<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status - Mermaid Beach Resort</title>
  <link rel="icon" type="image/ico" href="/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-dark);
      padding: 1.5rem;
    }
    .status-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      max-width: 480px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .status-icon-box {
      width: 4rem;
      height: 4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .status-icon-box.success {
      background-color: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-icon-box.failed {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .status-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-desc {
      color: var(--text-gray-400);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .receipt-details {
      background-color: var(--bg-alt);
      border: 1px solid var(--border-light);
      border-radius: 2px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      text-align: left;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.625rem 0;
      border-bottom: 1px dashed var(--border-light);
      font-size: 0.875rem;
    }
    .receipt-row:last-child {
      border-bottom: 0;
    }
    .receipt-label {
      color: var(--text-gray-500);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .receipt-value {
      color: var(--text-white);
      font-weight: 500;
    }
    .receipt-value.price {
      color: var(--primary-color);
      font-weight: 700;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-w-full {
      width: 100%;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="status-card">
    <div id="statusIconBox" class="status-icon-box success">
      <i id="statusIcon" data-lucide="check" class="w-8 h-8"></i>
    </div>
    
    <h3 id="statusTitle" class="status-title">Booking Confirmed!</h3>
    <p id="statusDesc" class="status-desc">Your 30% advance payment has been verified via bKash.</p>
    
    <div id="receiptBox" class="receipt-details">
      <div class="receipt-row">
        <span class="receipt-label">Booking ID:</span>
        <span id="receiptBookingId" class="receipt-value font-mono">#0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Total Amount:</span>
        <span id="receiptTotal" class="receipt-value font-mono">৳0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Advance Paid (30%):</span>
        <span id="receiptAdvance" class="receipt-value price font-mono">৳0</span>
      </div>
      <div class="receipt-row">
        <span class="receipt-label">Transaction ID:</span>
        <span id="receiptTrxId" class="receipt-value font-mono text-gray-400">N/A</span>
      </div>
    </div>
    
    <div class="btn-group">
      <button id="primaryActionBtn" class="btn btn-whatsapp btn-w-full">
        <i data-lucide="message-circle"></i> Contact Front Desk
      </button>
      <a href="/" class="btn btn-secondary btn-w-full" style="text-decoration:none;">
        Back to Homepage
      </a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const status = urlParams.get("status");
      const bookingId = urlParams.get("id");
      const total = urlParams.get("total") || "0";
      const advance = urlParams.get("advance") || "0";
      const trxId = urlParams.get("trx") || "N/A";
      const reason = urlParams.get("reason") || "payment_failed";

      const iconBox = document.getElementById("statusIconBox");
      const icon = document.getElementById("statusIcon");
      const title = document.getElementById("statusTitle");
      const desc = document.getElementById("statusDesc");
      const receiptBox = document.getElementById("receiptBox");
      const primaryBtn = document.getElementById("primaryActionBtn");

      if (status === "success") {
        // success layout
        iconBox.className = "status-icon-box success";
        icon.setAttribute("data-lucide", "check");
        title.innerText = "Booking Confirmed!";
        desc.innerText = "Your 30% advance payment has been verified via bKash.";

        document.getElementById("receiptBookingId").innerText = `#${bookingId}`;
        document.getElementById("receiptTotal").innerText = `৳${parseInt(total).toLocaleString()}`;
        document.getElementById("receiptAdvance").innerText = `৳${parseInt(advance).toLocaleString()}`;
        document.getElementById("receiptTrxId").innerText = trxId;

        // WhatsApp Confirmation redirect
        primaryBtn.addEventListener("click", () => {
          const phoneNumber = '8801819077914';
          const message = encodeURIComponent(`Hi Mermaid Resort! I just completed my online payment for Booking ID #${bookingId}. Total: ৳${parseInt(total).toLocaleString()} (Paid 30% Advance: ৳${parseInt(advance).toLocaleString()}). TrxID: ${trxId}. Please note my booking.`);
          window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
        });
      } else {
        // failure layout
        iconBox.className = "status-icon-box failed";
        icon.setAttribute("data-lucide", "x");
        title.innerText = "Payment Failed";
        
        let reasonLabel = "Your payment was cancelled or failed to process. No charges were made.";
        if (reason === "cancel") reasonLabel = "Your payment transaction was cancelled.";
        else if (reason === "bkash_auth_failed") reasonLabel = "bKash checkout authentication failed.";
        else if (reason === "insufficient_balance") reasonLabel = "Transaction failed: Insufficient Balance.";
        else if (reason === "debit_block") reasonLabel = "Transaction failed: Debit Block on wallet.";
        desc.innerText = reasonLabel;

        // Hide receipt details on failure
        receiptBox.style.display = "none";

        // Convert primary button to go back to booking
        primaryBtn.innerHTML = '<i data-lucide="arrow-left"></i> Try Booking Again';
        primaryBtn.className = "btn btn-primary btn-w-full";
        primaryBtn.addEventListener("click", () => {
          window.location.href = "/";
        });
      }

      // refresh icons
      lucide.createIcons();
    });
  </script>
</body>
</html>
