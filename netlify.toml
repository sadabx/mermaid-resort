[build]
  publish = "."
  functions = "backend/netlify/functions"
  command = "npm install --prefix backend"

# Route API endpoints to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/restaurant"
  to = "/restaurant.html"
  status = 200